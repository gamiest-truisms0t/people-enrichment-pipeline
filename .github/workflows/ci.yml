name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (the version is in the comment).
      # setup-uv publishes no moving major tag, so only the SHA or full tag resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Unit, contract and handler tests (with coverage, floor 90 %)
        run: |
          uv run pytest -m "not integration" --cov=enrich_pipeline --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=90 | tee pytest.log
          {
            echo "### Tests and coverage"
            echo
            echo '```'
            grep -E 'passed|failed|error' pytest.log | tail -1
            grep -E '^(Name|TOTAL|src/)' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: terraform fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/bootstrap infra/envs/dev; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          for d in infra/bootstrap infra/envs/dev infra/modules/*; do
            tflint --chdir="$d" --config "$GITHUB_WORKSPACE/.tflint.hcl"
          done
      - name: terraform-docs (stack and module READMEs are current)
        env:
          TFDOCS_VERSION: v0.24.0
          TFDOCS_SHA256: 9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3
        run: |
          curl -sSLo terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${TFDOCS_VERSION}/terraform-docs-${TFDOCS_VERSION}-linux-amd64.tar.gz"
          echo "${TFDOCS_SHA256}  terraform-docs.tar.gz" | sha256sum -c -
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo install -m 0755 terraform-docs /usr/local/bin/terraform-docs
          make tf-docs-check
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: checkov
        run: uvx checkov --config-file .checkov.yaml -d infra

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
