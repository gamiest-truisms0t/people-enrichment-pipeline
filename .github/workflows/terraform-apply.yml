name: terraform apply

# Deploys infra/envs/dev after a merge to main, with a role that only main can assume.
# The plan is saved and then applied, and a zero-credit end-to-end run on the cached
# demo file gates the deploy: a broken function fails the workflow, not the next upload.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: "1"

jobs:
  apply:
    name: apply infra/envs/dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Write the deployment's variables
        run: scripts/ci_tfvars.sh infra/envs/dev/ci.auto.tfvars
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_provider_name: ${{ vars.TF_VAR_PROVIDER_NAME }}
          TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
          TF_VAR_pdl_sandbox: ${{ vars.TF_VAR_PDL_SANDBOX }}
      - name: Package the Lambda code
        run: make package
      - name: Init
        run: make init
      - name: Plan
        run: terraform -chdir=infra/envs/dev plan -input=false -no-color -lock-timeout=5m -out=tfplan
      - name: Apply the saved plan
        run: terraform -chdir=infra/envs/dev apply -input=false -no-color -lock-timeout=5m tfplan
      - name: Post-deploy gate (cached demo file, zero credits)
        run: make e2e INPUT=data/demo/idempotency.csv
      - name: Summary
        run: |
          {
            echo "### Deployed infra/envs/dev from ${GITHUB_SHA::7}"
            echo
            echo '```'
            terraform -chdir=infra/envs/dev output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
