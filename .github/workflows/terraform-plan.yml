name: terraform plan

# Renders the infrastructure change of a pull request as a comment. Runs with a role that
# can only read the Terraform state (no refresh against AWS), so a pull request cannot
# read or touch any resource. The scheduled drift job is the one that refreshes.

on:
  pull_request:
    paths:
      - "infra/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: plan (no refresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate the state machine definition (Step Functions API)
        run: make asl-validate
      - name: Write the deployment's variables
        run: scripts/ci_tfvars.sh infra/envs/dev/ci.auto.tfvars
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_provider_name: ${{ vars.TF_VAR_PROVIDER_NAME }}
          TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
          TF_VAR_pdl_sandbox: ${{ vars.TF_VAR_PDL_SANDBOX }}
      - name: Package the Lambda code
        run: make package
      - name: Init
        run: make init
      - name: Plan
        id: plan
        run: |
          set +e
          terraform -chdir=infra/envs/dev plan -input=false -no-color -lock=false -refresh=false \
            -detailed-exitcode -out=tfplan > plan.log 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - name: Comment the plan on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT: ${{ steps.plan.outputs.exitcode }}
        run: |
          case "$EXIT" in
            0) status="No infrastructure changes" ;;
            2) status="Infrastructure changes" ;;
            *) status="Plan failed" ;;
          esac
          if [ "$EXIT" != "1" ]; then
            terraform -chdir=infra/envs/dev show -no-color tfplan > plan.txt 2>&1 || cp plan.log plan.txt
          else
            cp plan.log plan.txt
          fi
          {
            echo "### terraform plan: $status"
            echo
            echo "<sub>infra/envs/dev, without refresh, commit ${{ github.event.pull_request.head.sha }}</sub>"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            [ "$(wc -c < plan.txt)" -gt 60000 ] && echo "... (truncated, see the workflow log)"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          [ "$EXIT" != "1" ]
