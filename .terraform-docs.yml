# terraform-docs settings. `make tf-docs` regenerates the tables between the markers in
# each stack's and module's README.md (also a pre-commit hook); `make tf-docs-check`
# fails in CI when a README is stale.
formatter: markdown table

sections:
  show:
    - requirements
    - providers
    - modules
    - resources
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  description: true
  hide-empty: true
  required: true
  type: true
  # Provider versions come from the version constraints, not from .terraform.lock.hcl:
  # modules have no lock file in CI (pre-commit's validate hook creates untracked ones
  # locally), and the output must be identical everywhere for the check to hold.
  lockfile: false
