[project]
name = "enrich-pipeline"
version = "1.2.6"
description = "Serverless people-enrichment ETL on AWS: names in, analyst-ready Parquet out."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10",
  "boto3>=1.35",
  "aws-lambda-powertools>=3.10",
  "httpx>=0.27",
  "peopledatalabs>=6.4",
]

[project.scripts]
enrich = "enrich_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "moto[s3,dynamodb,ssm,stepfunctions]>=5.0",
  "respx>=0.21",
  "pyarrow>=19",
  "duckdb>=1.2",
  "boto3[crt]>=1.43.102",
  "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enrich_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs AWS credentials or network (deselected by default in CI)",
]

[tool.coverage.run]
source = ["enrich_pipeline"]
